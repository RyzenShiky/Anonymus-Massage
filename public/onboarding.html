<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Choose username</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens/tokens.css" />
  <link rel="stylesheet" href="../styles/foundation/base.css" />
  <link rel="stylesheet" href="../styles/components/ui.css" />
  <link rel="stylesheet" href="../styles/layouts/shell.css" />
</head>
<body>
  <div class="card auth-card">
    <h1>Pick a username</h1>
    <p class="sub">This becomes your public link</p>
    <div class="form-error" id="err"></div>
    <div class="form-group"><label>Username</label><input class="input" id="u" pattern="[a-zA-Z0-9_]{3,24}" /></div>
    <button class="btn btn-primary btn-block" id="go">Continue</button>
  </div>
  <script type="module" src="../src/ui/page-onboarding.js"></script>
</body>
