<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Log in — anonmsg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../styles/tokens/tokens.css" />
  <link rel="stylesheet" href="../styles/foundation/base.css" />
  <link rel="stylesheet" href="../styles/components/ui.css" />
  <link rel="stylesheet" href="../styles/layouts/shell.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="index.html">anon<span>msg</span></a>
  </header>
  <div class="card auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your inbox</p>
    <div class="form-error" id="err"></div>
    <form id="form">
      <div class="form-group">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" required autocomplete="email" />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" required autocomplete="current-password" minlength="6" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Log in</button>
    </form>
    <button class="btn btn-secondary btn-block" id="google" type="button" style="margin-top:12px">Continue with Google</button>
    <button class="btn btn-ghost btn-block" id="guest" type="button" style="margin-top:8px">Continue as Guest</button>
    <p class="auth-footer" style="margin-top:8px;font-size:0.8rem">Guest mode uses Firebase Anonymous Auth. Data can be linked later when you register.</p>
    <p class="auth-footer">No account? <a href="register.html">Create profile</a></p>
  </div>
  <script type="module" src="../src/ui/page-login.js"></script>
</body>
</html>
