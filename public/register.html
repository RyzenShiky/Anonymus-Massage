<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="data:," />
  <title>Create profile — anonmsg</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/styles/tokens/tokens.css" />
  <link rel="stylesheet" href="/styles/foundation/base.css" />
  <link rel="stylesheet" href="/styles/components/ui.css" />
  <link rel="stylesheet" href="/styles/layouts/shell.css" />
</head>
<body>
  <header class="topbar">
    <a class="topbar-brand" href="index.html">anon<span>msg</span></a>
  </header>
  <div class="card auth-card">
    <h1>Create profile</h1>
    <p class="sub">Get your anonymous inbox link</p>
    <div class="form-error" id="err"></div>
    <form id="form">
      <div class="form-group">
        <label for="username">Username</label>
        <input class="input" id="username" required pattern="[a-zA-Z0-9_]{3,24}" placeholder="yourname" />
      </div>
      <div class="form-group">
        <label for="email">Email</label>
        <input class="input" id="email" type="email" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="input" id="password" type="password" required minlength="6" />
      </div>
      <button class="btn btn-primary btn-block" type="submit">Create</button>
    </form>
    <p class="auth-footer">Have an account? <a href="login.html">Log in</a></p>
  </div>
  <script type="module" src="/src/ui/page-register.js"></script>
</body>
</html>
